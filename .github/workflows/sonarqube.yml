name: SonarQube Analysis

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-analyze:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: SonarQube needs it for blame/new-code analysis

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend - build, test, analyze
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -eu

          for service in \
              api-gateway \
              discovery-service \
              user-service \
              product-service \
              media-service \
              order-service
          do
              echo "::group::${service}"
              (
                  # Only product-service has a committed Maven wrapper; reuse it for
                  # every module, same trick the Jenkinsfile uses.
                  cd product-service
                  ./mvnw -B -ntp \
                      -f "../${service}/pom.xml" \
                      clean verify sonar:sonar \
                      -Dsonar.host.url="$SONAR_HOST_URL" \
                      -Dsonar.token="$SONAR_TOKEN" \
                      -Dsonar.projectKey="nexus-${service}" \
                      -Dsonar.projectName="nexus-${service}" \
                      -Dsonar.qualitygate.wait=true
              )
              echo "::endgroup::"
          done

      - name: Frontend - install and test with coverage
        working-directory: frontend
        run: |
          npm ci
          npm run test:coverage
          npm run build

      - name: Frontend - analyze
        uses: sonarsource/sonarqube-scan-action@v4
        with:
          projectBaseDir: frontend
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Frontend - quality gate check
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
